name: Bug report
description: Report a reproducible problem with the toolkit or docs.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal public-safe manifest or command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Public-safety check
      description: Confirm that no secrets, private paths, model files, logs, caches, or non-public samples are included.
    validations:
      required: true
