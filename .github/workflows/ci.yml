name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Print manifest schema
        run: asset-pipeline-steward schema

      - name: Scan repository public safety
        run: asset-pipeline-steward repo-scan .

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Validate example manifest
        run: asset-pipeline-steward examples/fixture_manifest.json

      - name: Validate model inventory manifest
        run: asset-pipeline-steward examples/model_inventory_manifest.json

      - name: Validate review queue manifest
        run: asset-pipeline-steward examples/review_queue_manifest.json

      - name: Render maintainer report
        run: asset-pipeline-steward report examples/fixture_manifest.json

      - name: Render model inventory report
        run: asset-pipeline-steward report examples/model_inventory_manifest.json

      - name: Render review queue report
        run: asset-pipeline-steward report examples/review_queue_manifest.json
