[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-asset-pipeline-steward"
version = "0.1.0"
description = "Public-safe checks for AI-generated asset pipeline manifests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AI Asset Pipeline Steward contributors" }
]
keywords = ["ai", "asset-pipeline", "manifest", "codex", "open-source"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]

[project.scripts]
asset-pipeline-steward = "asset_pipeline_steward.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
